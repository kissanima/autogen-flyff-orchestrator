<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyFF MAF Orchestrator</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --line:#252b35; --text:#e6e9ef; --muted:#8b94a3;
    --blue:#2f6fd0; --green:#2f8f5b; --grey:#3a4150; --amber:#b98324;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;font:14px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--text)}
  aside{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--line);
        padding:16px;overflow-y:auto}
  aside h1{font-size:15px;font-weight:600;margin:0 0 4px}
  aside .sub{font-size:12px;color:var(--muted);margin-bottom:16px}
  .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
     margin:14px 0 6px}
  .v{font-size:12px;word-break:break-all}
  .file{font-size:12px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--muted)}
  .file b{color:var(--text);font-weight:500}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{display:flex;gap:8px;align-items:center;padding:10px 16px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  header .spacer{flex:1}
  button{background:transparent;border:1px solid var(--line);color:var(--text);
         padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  button:hover{border-color:#3d4655}
  button.primary{background:var(--blue);border-color:var(--blue)}
  button.danger{background:#a32d2d;border-color:#a32d2d}
  button:disabled{opacity:.45;cursor:default}
  #log{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-direction:column;max-width:78%}
  .row.left{align-self:flex-start;align-items:flex-start}
  .row.right{align-self:flex-end;align-items:flex-end}
  .row.sys{align-self:center;align-items:center;max-width:88%}
  .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
  .bubble{padding:9px 13px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;
          font-size:13.5px}
  .left .bubble{background:var(--blue)}
  .right .bubble{background:var(--green)}
  .sys .bubble{background:var(--grey);color:#cfd6e2;font-size:12.5px;text-align:center}
  footer{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;background:var(--panel)}
  textarea{flex:1;resize:none;height:56px;background:var(--bg);color:var(--text);
           border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
  textarea:focus{outline:none;border-color:#3d4655}
  .hidden{display:none}
</style>
</head>
<body>
<aside>
  <h1>FlyFF Orchestrator</h1>
  <div class="sub">Microsoft Agent Framework</div>
  <div class="k">Project root</div><div class="v" id="root">—</div>
  <div class="k">Models</div><div class="v" id="models">—</div>
  <div class="k">Write scopes</div><div class="v" id="scopes">—</div>
  <div class="k">Budget</div><div class="v" id="budget">—</div>
  <div class="k">Context files</div>
  <div id="files"></div>
</aside>

<main>
  <header>
    <strong id="title">Ready</strong>
    <span class="spacer"></span>
    <button id="debug">Show debug</button>
    <button id="copy">Copy Chat</button>
    <button id="run" class="primary">Run</button>
    <button id="stop" class="danger" disabled>Stop</button>
  </header>
  <div id="log"></div>
  <footer>
    <textarea id="task" placeholder="Kickoff instruction (leave empty to use the built-in one)"></textarea>
    <button id="send" class="primary">Run</button>
  </footer>
</main>

<script>
const SIDES = {domain:"left", shell:"right", user:"right", coordinator:"sys", status:"sys", note:"sys"};
const TRANSCRIPT = [];
let debugOn = false, ws = null, running = false;

const $ = id => document.getElementById(id);
const now = () => new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});

function bubble(source, text, cls) {
  const side = SIDES[source] || "sys";
  const row = document.createElement("div");
  row.className = "row " + side;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = source + " · " + now();
  const body = document.createElement("div");
  body.className = "bubble";
  body.textContent = text;
  row.append(meta, body);
  $("log").appendChild(row);
  $("log").scrollTop = $("log").scrollHeight;
  TRANSCRIPT.push({t: now(), source, text});
}

async function boot() {
  const cfg = await (await fetch("/api/config")).json();
  $("root").textContent = cfg.project_root;
  $("models").textContent = "domain: " + cfg.models.domain + "\nshell: " + cfg.models.shell;
  $("models").style.whiteSpace = "pre-line";
  $("scopes").textContent = Object.entries(cfg.scopes).map(([k, v]) => k + " → " + v.join(", ")).join("\n");
  $("scopes").style.whiteSpace = "pre-line";
  $("budget").textContent = cfg.max_requests + " requests · " + cfg.max_rounds + " rounds max";
  $("task").placeholder = cfg.kickoff;
  const ctx = await (await fetch("/api/context")).json();
  $("files").innerHTML = (ctx.files || []).slice(0, 18).map(f =>
    `<div class="file"><b>${f.name}</b><br>${f.lines} lines · ${f.kb} KB</div>`).join("")
    || '<div class="file">project root not found</div>';
}

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = ev => handle(JSON.parse(ev.data));
  ws.onclose = () => { setRunning(false); $("title").textContent = "Disconnected"; };
}

function handle(m) {
  if (m.type === "message") { bubble(m.source, m.content); }
  else if (m.type === "note") { if (debugOn) bubble("coordinator", m.content); }
  else if (m.type === "status") { if (debugOn) bubble("status", m.source + ": " + m.content); }
  else if (m.type === "start") { $("title").textContent = "Running " + m.run_id; setRunning(true); }
  else if (m.type === "done") {
    $("title").textContent = "Finished — " + m.stop_reason;
    bubble("coordinator", "Run finished: " + m.stop_reason);
    setRunning(false);
  }
  else if (m.type === "stopped") { $("title").textContent = "Stopped"; bubble("coordinator", m.stop_reason); setRunning(false); }
  else if (m.type === "error") { $("title").textContent = "Error"; bubble("coordinator", m.content); setRunning(false); }
}

function setRunning(on) {
  running = on;
  $("run").disabled = on; $("send").disabled = on; $("stop").disabled = !on;
}

function start() {
  if (!ws || ws.readyState !== 1) connect();
  const task = $("task").value.trim();
  const payload = {cmd: "run", task};
  const sendIt = () => ws.send(JSON.stringify(payload));
  if (ws.readyState === 1) sendIt(); else ws.addEventListener("open", sendIt, {once: true});
}

$("run").onclick = start;
$("send").onclick = start;
$("stop").onclick = () => ws && ws.readyState === 1 && ws.send(JSON.stringify({cmd: "stop"}));
$("debug").onclick = () => {
  debugOn = !debugOn;
  $("debug").textContent = debugOn ? "Hide debug" : "Show debug";
};
$("copy").onclick = async () => {
  const text = TRANSCRIPT.map(e => `[${e.t}] ${e.source}: ${e.text}`).join("\n\n");
  try { await navigator.clipboard.writeText(text); $("copy").textContent = "Copied"; }
  catch { $("copy").textContent = "Copy failed"; }
  setTimeout(() => { $("copy").textContent = "Copy Chat"; }, 1500);
};

boot(); connect();
</script>
</body>
</html>
