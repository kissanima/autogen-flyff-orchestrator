<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoGen — Flyff Overnight Run</title>
<style>
  :root {
    --bg: #13151a; --panel: #1b1e26; --panel2: #22262f; --border: #2c313d;
    --text: #e2e6ee; --dim: #8b93a3;
    --a-bg: #1f3a5f; --a-ink: #cfe3ff;      /* Agent A: left, blue   */
    --b-bg: #173a28; --b-ink: #c9f0d9;      /* Agent B: right, green */
    --sys-bg: #23262e;                      /* Supervisor/system: gray */
    --user-bg: #2b2f3a;                     /* you: right, neutral   */
    --tool: #9a6cff; --warn: #e0a83c; --err: #e05555; --ok: #3fb96f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font: 13.5px/1.5 "Segoe UI", system-ui, sans-serif;
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px;
           padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 15px; font-weight: 600; }
  header .proj { color: var(--dim); font-size: 12px; }
  #conn { margin-left: auto; font-size: 12px; color: var(--dim); }
  #conn.on { color: var(--ok); }
  #copybtn { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
             border-radius: 7px; padding: 4px 11px; font-size: 12px; font-weight: 500;
             cursor: pointer; margin-left: 10px; }
  #copybtn:hover { border-color: var(--accent); color: var(--accent); }
  #copybtn.done { border-color: var(--ok); color: var(--ok); }
  main { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px 18px; }

  /* ---- chat bubbles ---- */
  .bubble { max-width: 78%; margin-bottom: 10px; padding: 8px 12px;
            border-radius: 14px; position: relative; word-break: break-word; }
  .bubble .meta { font-size: 10.5px; color: var(--dim); margin-bottom: 2px;
                  display: flex; gap: 8px; }
  .bubble .meta .who { font-weight: 600; }
  .bubble .meta .ts { margin-left: auto; }
  .bubble pre { white-space: pre-wrap; font: 13px/1.55 "Segoe UI", sans-serif;
                font-family: inherit; }
  .left  { margin-right: auto; background: var(--a-bg); color: var(--a-ink);
           border-bottom-left-radius: 4px; }
  .left .meta .who { color: #8fc1ff; }
  .right { margin-left: auto;  background: var(--b-bg); color: var(--b-ink);
           border-bottom-right-radius: 4px; }
  .right .meta .who { color: #7fe0a8; }
  .me    { margin-left: auto;  background: var(--user-bg); color: var(--text);
           border-bottom-right-radius: 4px; }
  .me .meta .who { color: var(--dim); }
  .sys   { margin: 6px auto;   background: var(--sys-bg); color: var(--dim);
           text-align: center; font-size: 12px; max-width: 88%;
           border-radius: 10px; padding: 6px 14px; }
  .sys .meta { justify-content: center; }
  .sys.error { background: #2e1a1a; color: #f0b9b9; border: 1px solid #573030; }
  .sys .who { color: var(--warn); }
  .sys.ok { color: var(--ok); }

  /* tool activity: compact one-liners, not bubbles */
  .toolrow { margin: 4px auto; max-width: 88%; font: 11px/1.4 Consolas, monospace;
             color: var(--dim); background: transparent; text-align: center; }
  .toolrow .tname { color: var(--tool); font-weight: 600; }
  .toolrow details { display: inline; }
  .toolrow summary { cursor: pointer; list-style: none; }
  .toolrow summary::-webkit-details-marker { display: none; }
  .toolrow pre { display: block; text-align: left; background: var(--panel);
                 border: 1px solid var(--border); border-radius: 8px;
                 padding: 6px 10px; margin-top: 4px; max-height: 220px;
                 overflow-y: auto; white-space: pre-wrap; }

  /* debug accordions — hidden unless body.debug */
  .debug-only { display: none; }
  body.debug .debug-only { display: block; }
  .msg.trace { border: 1px solid var(--border); border-radius: 8px;
               background: var(--panel); padding: 6px 10px; margin: 4px auto;
               max-width: 88%; font-size: 11px; }
  .msg.trace summary { cursor: pointer; color: var(--dim); }
  .msg.trace .trow { margin: 2px 0; font-family: Consolas, monospace; }
  .msg.trace .trole { color: var(--accent, #4f8cff); font-weight: 600; }
  .msg.trace .ttok { color: var(--warn); }
  .badge { display: inline-block; background: var(--panel2); border: 1px solid var(--border);
           color: var(--tool); border-radius: 4px; padding: 1px 6px; font-size: 10.5px;
           margin: 2px 4px 2px 0; font-family: Consolas, monospace; }

  #inputbar { display: flex; gap: 8px; padding: 12px 16px;
              background: var(--panel); border-top: 1px solid var(--border); }
  #task { flex: 1; resize: none; height: 72px; background: var(--panel2);
          color: var(--text); border: 1px solid var(--border); border-radius: 10px;
          padding: 8px 10px; font: 12px Consolas, monospace; }
  #task:focus { outline: 1px solid #4f8cff; }
  button { background: #4f8cff; color: #fff; border: 0; border-radius: 10px;
           padding: 0 18px; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  #stop { background: var(--err); display: none; }
  aside { width: 320px; border-left: 1px solid var(--border); background: var(--panel);
          display: flex; flex-direction: column; overflow-y: auto; }
  .sec { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .sec h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
            color: var(--dim); margin-bottom: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  input[type=number] { background: var(--panel2); color: var(--text);
          border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; width: 80px; }
  .toggle { position: relative; width: 34px; height: 18px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle span { position: absolute; inset: 0; background: var(--border);
                 border-radius: 18px; transition: .15s; cursor: pointer; }
  .toggle span:before { content: ""; position: absolute; width: 14px; height: 14px;
                 left: 2px; top: 2px; background: var(--dim); border-radius: 50%; transition: .15s; }
  .toggle input:checked + span { background: var(--ok); }
  .toggle input:checked + span:before { transform: translateX(16px); background: #fff; }
  .toggletxt { font-size: 12px; }
  .toggletxt small { display: block; color: var(--dim); font-size: 10.5px; }
  .legend { font-size: 12px; }
  .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  #ctx { font-size: 11.5px; color: var(--dim); white-space: pre-wrap; }
  #ctx .opendec { color: var(--warn); }
  .loghead { color: var(--text); font-weight: 600; font-size: 11.5px; margin: 6px 0 2px; }
  .logtail { color: var(--dim); font-family: Consolas, monospace; font-size: 10.5px;
             white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<header>
  <h1>AutoGen — Overnight Run</h1>
  <span class="proj" id="projpath"></span>
  <button id="copybtn" title="Copy the entire conversation as text">📋 Copy Chat</button>
  <span id="conn">disconnected</span>
</header>
<main>
  <div id="chat">
    <div id="log"></div>
    <div id="inputbar">
      <textarea id="task" spellcheck="false"></textarea>
      <button id="run">Run</button>
      <button id="stop">Stop</button>
    </div>
  </div>
  <aside>
    <div class="sec">
      <h2>Team (fixed)</h2>
      <div class="legend">
        <div><span class="dot" style="background:#4f8cff"></span><b>Agent A · domain</b> — pro · left, blue</div>
        <div><span class="dot" style="background:#3fb96f"></span><b>Agent B · shell</b> — flash · right, green</div>
        <div><span class="dot" style="background:var(--dim)"></span><b>Executor</b> — terminal, runs their code blocks</div>
      </div>
    </div>
    <div class="sec">
      <h2>Run</h2>
      <div class="row">
        <label class="toggletxt">max rounds <small>default 80, hard cap 150</small></label>
        <input type="number" id="maxturns" value="80" min="2" max="150">
      </div>
      <div class="row">
        <label class="toggletxt">Show debug
          <small>LLM trace + raw tool output</small></label>
        <label class="toggle"><input type="checkbox" id="debug"><span></span></label>
      </div>
      <div class="row">
        <label class="toggletxt">File writes: <b style="color:var(--ok)">ALWAYS ON</b>
          <small>hardcoded · per-agent scopes enforced</small></label>
        <label class="toggle"><input type="checkbox" checked disabled><span></span></label>
      </div>
    </div>
    <div class="sec">
      <h2>Project state (other agents)</h2>
      <div id="ctx">loading…</div>
    </div>
    <div class="sec">
      <h2>Handoff logs</h2>
      <div id="logs"></div>
    </div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ws = null, running = false;

const KICKOFF =
"Welcome to the overnight run. You have a 5,000 request budget. \n" +
"Agent A: Start with A1 (Dungeons) from BACKLOG.md.\n" +
"Agent B: Start with B1 (UI Controllers) from BACKLOG.md.\n" +
"Work continuously, batch your code generation, and reply TASK_COMPLETE when done. Do not ask for human input.";
$("task").value = KICKOFF;

$("debug").addEventListener("change", e => {
  document.body.classList.toggle("debug", e.target.checked);
});

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $("conn").textContent = "connected"; $("conn").className = "on"; };
  ws.onclose = () => { $("conn").textContent = "disconnected"; $("conn").className = "";
                       running = false; setButtons(); setTimeout(connect, 2000); };
  ws.onmessage = ev => handle(JSON.parse(ev.data));
}
function setButtons() {
  $("run").style.display = running ? "none" : "";
  $("stop").style.display = running ? "" : "none";
}
const now = () => new Date().toLocaleTimeString([], {hour12: false});

function bubble(side, who, text) {
  record("message", who, text);
  const d = document.createElement("div");
  d.className = "bubble " + side;
  d.innerHTML = `<div class="meta"><span class="who">${esc(who)}</span>` +
                `<span class="ts">${now()}</span></div>`;
  const pre = document.createElement("pre");
  pre.textContent = text || "";
  d.appendChild(pre);
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return pre;
}
function sysline(who, text, cls) {
  record("system", who, text);
  const d = document.createElement("div");
  d.className = "sys " + (cls || "");
  d.innerHTML = `<div class="meta"><span class="who">${esc(who)}</span>` +
                `<span class="ts">${now()}</span></div>`;
  d.appendChild(document.createTextNode(text || ""));
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
function toolrow(source, name, args, result) {
  record("tool", source, `[${name}] ${args ? "args: " + args : ""}` +
         (result ? `\n  → ${result}` : ""));
  const d = document.createElement("div");
  d.className = "toolrow";
  const det = document.createElement("details");
  det.innerHTML = `<summary>🔧 <span class="tname">${esc(source)} · ${esc(name)}</span>` +
                  ` ${esc(String(args).slice(0, 60))}${result ? " ✓" : ""}</summary>`;
  const pre = document.createElement("pre");
  pre.textContent = (args ? "args: " + args + "\n" : "") + (result || "");
  det.appendChild(pre);
  d.appendChild(det);
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
function traceNode(m) {
  const label = m.kind === "LLMStreamStart" ? "LLM call → sent"
              : m.kind === "LLMCall"       ? "LLM reply (non-stream)"
                                           : "LLM reply (stream end)";
  const d = document.createElement("details");
  d.className = "msg trace debug-only";
  const head = [];
  if (m.messages) head.push(m.messages.map(x =>
    `<div class="trow"><span class="trole">${esc(x.role)}</span> ${esc(x.preview)}</div>`).join(""));
  if (m.reply || (m.tool_calls && m.tool_calls.length)) {
    head.push(`<div class="trow"><span class="trole">assistant</span> ${esc(m.reply || "")}` +
      (m.tool_calls || []).map(c =>
        `<span class="badge">${esc(c.name)}</span>${esc(c.arguments)}`).join("") +
      `</div>`);
  }
  const toks = (m.prompt_tokens != null)
    ? ` <span class="ttok">[${m.prompt_tokens} in / ${m.completion_tokens} out]</span>` : "";
  d.innerHTML = `<summary>${label}${toks}</summary>` + head.join("");
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

const SIDES = {domain: "left", shell: "right", user: "me",
               executor: "sys", gate: "sys", supervisor: "sys"};
// Structured transcript so Copy Chat is faithful (the DOM only holds rendering).
const TRANSCRIPT = [];
function record(kind, who, text) {
  TRANSCRIPT.push({ t: new Date(), kind, who, text: String(text ?? "") });
}
function handle(m) {
  if (m.type === "start") {
    sysline("session", `3-agent round-robin started · max_rounds=${m.max_rounds}` +
            (m.trace ? " · debug trace on" : ""));
  } else if (m.type === "TextMessage" || m.type === "UserInputMessage") {
    const side = SIDES[m.source] || "me";
    if (side === "sys") sysline(m.source, m.content);
    else bubble(side, m.source, m.content);
  } else if (m.type === "ToolCallRequestEvent") {
    m.tool_calls.forEach(c => toolrow(m.source, c.name, c.arguments, null));
  } else if (m.type === "ToolCallExecutionEvent") {
    toolrow(m.source, "result", "", m.content);
  } else if (m.type === "trace") {
    traceNode(m);
  } else if (m.type === "done" || m.type === "stopped") {
    sysline("end", m.stop_reason, "ok");
    running = false; setButtons();
  } else if (m.type === "error") {
    sysline("error", m.content, "error");
    running = false; setButtons();
  }
}

$("run").onclick = () => {
  const task = $("task").value.trim();
  if (!task || ws.readyState !== 1) return;
  $("log").innerHTML = "";
  TRANSCRIPT.length = 0;
  ws.send(JSON.stringify({
    cmd: "task", task,
    allow_write: true,               // hardcoded ON; backend enforces scopes
    max_turns: +$("maxturns").value,
    trace: $("debug").checked,       // trace only fetched when Show debug is on
  }));
  running = true; setButtons();
};
$("stop").onclick = () => ws.send(JSON.stringify({cmd: "stop"}));

function formatTranscript() {
  const pad = n => String(n).padStart(2, "0");
  const stamp = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const hdr = `AutoGen FlyFF Orchestrator — conversation\n` +
              `Project: ${$("projpath").textContent || ""}\n` +
              `Exported: ${new Date().toISOString()}\n` +
              `${"-".repeat(64)}\n\n`;
  const body = TRANSCRIPT.map(e => {
    const label = e.kind === "tool" ? `${e.who} (tool)` :
                  e.kind === "system" ? `[${e.who}]` : e.who;
    return `[${stamp(e.t)}] ${label}:\n${e.text}\n`;
  }).join("\n");
  return hdr + (body || "(no messages yet)\n");
}

$("copybtn").onclick = async () => {
  const text = formatTranscript();
  try {
    await navigator.clipboard.writeText(text);
    return flashCopy("📋 Copied!");
  } catch (_) {
    // Clipboard API needs a secure context; fall back to a hidden textarea.
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    flashCopy(ok ? "📋 Copied!" : "Copy failed");
  }
};
function flashCopy(msg) {
  const b = $("copybtn");
  const old = b.textContent;
  b.textContent = msg;
  b.classList.add("done");
  setTimeout(() => { b.textContent = old; b.classList.remove("done"); }, 1400);
}
$("task").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("run").click(); }
});

fetch("/api/context").then(r => r.json()).then(ctx => {
  $("projpath").textContent = ctx.project;
  const open = ctx.open_decisions || 0;
  $("ctx").innerHTML = open
    ? `<span class="opendec">${open} OPEN decision(s) need your call.</span>`
    : "No OPEN decisions — nothing needs your call right now.";
  const logs = $("logs");
  (ctx.files || []).forEach(f => {
    const row = document.createElement("div");
    row.className = "logtail";
    row.textContent = `${f.name} · ${f.lines} lines · ${f.kb} KB` +
                      (f.preview ? `\n   ${f.preview}` : "");
    logs.appendChild(row);
  });
  if (!(ctx.files || []).length) logs.textContent = "no handoff files found";
}).catch(() => { $("ctx").textContent = "project context unavailable"; });

connect();
setButtons();
</script>
</body>
</html>
